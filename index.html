<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freemint Agent Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div>
            <p class="eyebrow">System</p>
            <h1>AgentRam</h1>
          </div>
        </div>

        <nav class="nav">
          <a class="active" href="#">Overview</a>
          <a href="#">Agents</a>
          <a href="#">Alerts</a>
          <a href="#">Reports</a>
          <a href="#">Settings</a>
        </nav>

        <div class="mini-card">
          <p class="eyebrow">Network Health</p>
          <strong>96.4%</strong>
          <span>Stable this hour</span>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Monitoring Dashboard</p>
            <h2>Freemint Agent ID Pantauan</h2>
          </div>
          <button class="primary-btn">Export Report</button>
        </header>

        <section class="stats-grid" id="statsGrid"></section>

        <section class="panel controls-panel">
          <div class="controls-head">
            <div>
              <p class="eyebrow">Filter</p>
              <h3>Daftar Pantauan</h3>
            </div>
            <div class="search-wrap">
              <input id="searchInput" type="text" placeholder="Cari agent ID, nama, wallet..." />
            </div>
          </div>

          <div class="filter-row" id="statusFilters"></div>
        </section>

        <section class="panel table-panel">
          <div class="table-header">
            <div>
              <p class="eyebrow">Live Data</p>
              <h3>Agent Registry</h3>
            </div>
            <span id="resultCount" class="result-badge">0 results</span>
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Agent ID</th>
                  <th>Nama</th>
                  <th>Wallet</th>
                  <th>Status</th>
                  <th>Risk</th>
                  <th>Last Sync</th>
                  <th>Notes</th>
                </tr>
              </thead>
              <tbody id="agentTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
